<!DOCTYPE html>
<html>
<head>
    <title>Profile Form</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            width:400px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:10px;
            font-weight:bold;
        }

        textarea,
        input[type="text"],
        input[type="file"]{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {% comment %} <label>Location</label>
        <input type="text" name="first_name" value="{{ setting.first_name }}" placeholder="Enter your location">

        <label>Location</label>
        <input type="text" name="last_name" value="{{ setting.last_name }}" placeholder="Enter your location"> {% endcomment %}
        
        <label>Bio</label>
        <textarea  rows="4" name="bio" placeholder="Enter your bio">{{ setting.bio }}</textarea>

        <label>Current Profile Image</label>
<img src="{{ setting.profileimg.url }}" alt="Profile" width="150">

<label>Choose New Profile Image</label>
<input type="file" name="profileimg">

        <label>Location</label>
        <input type="text" name="location" value="{{ setting.location }}" placeholder="Enter your location">

        <button type="submit">Save Profile</button>
    </form>
</div>

</body>
</html>
