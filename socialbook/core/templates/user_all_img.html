<div class="post-actions">
    <!-- 1. Added class="like-form" -->
    <form action="{% url 'like_post' %}" method="POST" class="like-form" style="display: inline;">
        {% csrf_token %}
        <input type="hidden" name="post_id" value="{{ post.id }}">
        <button type="submit" class="like-btn">
            ❤️ Like
        </button>
    </form>

    <!-- 2. Added unique ID to this span -->
    <span class="like-count" id="like-count-{{ post.id }}">
        {% if post.no_of_likes == 0 %}
            no likes
        {% elif post.no_of_likes == 1 %}
            1 like
        {% else %}
            {{ post.no_of_likes }} likes
        {% endif %}
    </span>
</div>

    <div class="post-content">
        {{ post.caption }}
    </div>
</div>

{% endfor %}
       
    </main>

    <!-- RIGHT -->
    <aside class="right-sidebar">

        <div class="profile-card">
            
            <div>
                <b>rijo_dev</b><br>
                <small>Web Dev</small>
            </div>
        </div>

    </aside>
