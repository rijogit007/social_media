<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:380px;
        }

        .signup-box{
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.2);
        }

        .signup-box h2{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group input{
            width:100%;
            padding:13px 15px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
            transition:.3s;
        }

        .input-group input:focus{
            border-color:#4facfe;
            outline:none;
            box-shadow:0 0 8px rgba(79,172,254,.3);
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:8px;
            background:#4facfe;
            color:#fff;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1f8ef1;
        }

        .messages{
            margin-bottom:15px;
        }

        .message{
            background:#ffecec;
            color:#d8000c;
            padding:10px;
            border-left:5px solid #d8000c;
            border-radius:6px;
            margin-bottom:10px;
            font-size:14px;
        }

        .footer{
            text-align:center;
            margin-top:18px;
            color:#666;
            font-size:14px;
        }

        .footer a{
            color:#4facfe;
            text-decoration:none;
            font-weight:bold;
        }

        .footer a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="signup-box">

        <h2>Welcome Back 👋</h2>

        <div class="messages">
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input type="text"
                       name="user_name"
                       placeholder="Username"
                       required>
            </div>

            <div class="input-group">
                <input type="password"
                       name="password1"
                       placeholder="Password"
                       required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </div>

    </div>

</div>

</body>
</html>
