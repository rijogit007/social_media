    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBook</title>

    <style>
    :root{
        --primary:#2563eb;
        --bg:#f8fafc;
        --card:#ffffff;
        --text:#1e293b;
        --border:#e2e8f0;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        background:var(--bg);
        color:var(--text);
    }

    /* NAVBAR */
    .navbar{
        position:sticky;
        top:0;
        z-index:1000;
        background:rgba(255,255,255,.9);
        backdrop-filter:blur(12px);
        border-bottom:1px solid var(--border);
        padding:16px 8%;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .logo{
        font-size:28px;
        font-weight:800;
        color:var(--primary);
    }

    .search{
        width:300px;
        padding:12px;
        border:none;
        outline:none;
        background:#eef4ff;
        border-radius:12px;
    }

    .container{
        max-width:1300px;
        margin:30px auto;
        display:grid;
        grid-template-columns:250px 1fr 320px;
        gap:25px;
        padding:0 20px;
    }

    /* SIDEBARS */
    .left-sidebar,.right-sidebar{
        position:sticky;
        top:90px;
        height:fit-content;
    }

    .menu-card,.profile-card,.suggestions{
        background:var(--card);
        border-radius:20px;
        padding:20px;
        box-shadow:0 10px 30px rgba(0,0,0,.05);
    }

    .menu-item{
        padding:15px;
        border-radius:12px;
        cursor:pointer;
    }
    .menu-item:hover{background:#eef4ff}

    /* STORIES */
    .stories{
        display:flex;
        gap:15px;
        overflow-x:auto;
        padding:15px;
        background:var(--card);
        border-radius:20px;
        margin-bottom:20px;
    }

    /* POSTS */
    .post{
        background:var(--card);
        border-radius:20px;
        overflow:hidden;
        margin-bottom:20px;
        box-shadow:0 10px 30px rgba(0,0,0,.05);
    }

    .post-header{
        display:flex;
        align-items:center;
        padding:15px;
    }

    .post-header img{
        width:45px;
        height:45px;
        border-radius:50%;
        margin-right:10px;
    }

    .post-image{
        width:100%;
        height:400px;
        object-fit:cover;
    }

    .post-content{
        padding:15px;
    }

    /* ================= MODAL (FIXED) ================= */
    .modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.6);
        justify-content:center;
        align-items:center;
        z-index:2000;
    }

    .modal-content{
        background:#fff;
        width:380px;
        border-radius:16px;
        padding:20px;
        display:flex;
        flex-direction:column;
        gap:12px;
    }

    .modal-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .close{
        font-size:28px;
        cursor:pointer;
    }

    .modal-content textarea{
        height:100px;
        padding:10px;
        border:1px solid #ddd;
        border-radius:10px;
        resize:none;
    }

    .modal-content button{
        padding:10px;
        border:none;
        border-radius:10px;
        background:var(--primary);
        color:#fff;
        cursor:pointer;
    }

    /* MOBILE */
    @media(max-width:1000px){
        .container{
            grid-template-columns:1fr;
        }
        .left-sidebar,.right-sidebar{
            display:none;
        }
        .search{
            display:none;
        }
    }
    </style>
    </head>

    <body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">SocialBook</div>
        <input class="search" placeholder="Search people, posts...">
        <div>🏠 🔔 💬 👤</div>
    </nav>

    <div class="container">

    <!-- LEFT -->
    <aside class="left-sidebar">
        <div class="menu-card">

            <div class="menu-item" id="openUpload"
                style="color:var(--primary);font-weight:600;">
                ➕ Create Post
            </div>

            <div class="menu-item">🏠 Home</div>
            <div class="menu-item">🔥 Trending</div>
            <div class="menu-item">👥 Friends</div>
            <div class="menu-item">
                <a href="{% url 'profile' %}">👤 Profile</a>
            </div>
            <div class="menu-item">📸 Photos</div>

            <div class="menu-item">
                <a href="{% url 'settings' %}">⚙ Settings</a>
            </div>
            <div class="menu-item">
                <a href="{% url 'logout' %}">Logout</a>
            </div>

        </div>
    </aside>

    <!-- FEED -->
    <main>

        <div class="stories">
            <div>Story 1</div>
            <div>Story 2</div>
            <div>Story 3</div>
        </div>
       {% for post in all_posts %}

<div class="post">

    <div class="post-header">
        <img src="{{ post.user.profile.profileimg.url }}">

        <div>
            <strong>{{ post.user.username }}</strong>
        </div>

    </div>

    <img class="post-image"
         src="{{ post.image_upload.url }}">

    <div class="post-content">
        {{ post.caption }}
    </div>

</div>

{% endfor %}
       
    </main>

    <!-- RIGHT -->
    <aside class="right-sidebar">

        <div class="profile-card">
            <img src="https://i.pravatar.cc/150?img=20">
            <div>
                <b>rijo_dev</b><br>
                <small>Web Dev</small>
            </div>
        </div>

    </aside>

    </div>

   <form action="{% url 'upload' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
    <!-- ================= MODAL ================= -->
    <div id="uploadModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h3>Create Post</h3>
                <span id="closeModal" class="close">&times;</span>
            </div>

            <input type="file" name="image_upload" >
            <textarea  name="caption"  placeholder="Write a caption..."></textarea>
            <button>Post</button>

        </div>
    </div>

    <form>

    <!-- SCRIPT -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const openBtn = document.getElementById("openUpload");
        const modal = document.getElementById("uploadModal");
        const closeBtn = document.getElementById("closeModal");

        openBtn.addEventListener("click", () => {
            modal.style.display = "flex";
        });

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });

    });
    </script>

    </body>
    </html>
