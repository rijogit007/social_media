<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

.signup-box{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.signup-box h2{
    text-align:center;
    color:#333;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
}

.input-box input:focus{
    border-color:#2575fc;
    outline:none;
    box-shadow:0 0 8px rgba(37,117,252,.3);
}

button{
    width:100%;
    padding:13px;
    background:#2575fc;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1557d6;
}

.message{
    background:#ffecec;
    color:#d8000c;
    padding:10px;
    border-left:5px solid #d8000c;
    border-radius:6px;
    margin-bottom:15px;
}

.login-link{
    text-align:center;
    margin-top:18px;
    color:#555;
}

.login-link a{
    color:#2575fc;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="signup-box">

    <h2>Create Account</h2>

    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <input type="text" name="user_name" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="text" name="first_name" placeholder="Full Name" required>
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <input type="password" name="password1" placeholder="Password" required>
        </div>

        <div class="input-box">
            <input type="password" name="password2" placeholder="Confirm Password" required>
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'signin' %}">Login</a>
    </div>

</div>

</body>
</html>
